<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-title" content="番号メモ">
  <link rel="apple-touch-icon" href="app-icon.png">
  <link rel="icon" type="image/png" href="app-icon.png">
  <title>番号メモ</title>
  <style>
    :root{
      --bg:#f4f4f2;
      --card:#ffffff;
      --text:#111;
      --muted:#777;
      --line:#deded9;
      --dark:#171717;
      --accent:#e7a100;
      --danger:#b42318;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .wrap{
      width:min(100%,520px);
      margin:0 auto;
      padding:18px 16px calc(28px + env(safe-area-inset-bottom));
    }
    h1{font-size:22px;margin:4px 0 14px}
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:20px;
      padding:16px;
      margin-bottom:14px;
    }
    .label{font-size:13px;color:var(--muted);margin-bottom:8px}
    .types{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    .type{
      border:1px solid var(--line);
      background:#fff;
      border-radius:999px;
      min-height:42px;
      padding:0 14px;
      font-size:15px;
    }
    .type.active{background:var(--dark);color:#fff;border-color:var(--dark)}
    .display{
      min-height:78px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#eceae7;
      border:2px solid #d4d1cc;
      border-radius:14px;
      font-size:42px;
      font-weight:800;
      letter-spacing:.12em;
      padding-left:.12em;
      overflow:hidden;
      margin-bottom:14px;
    }
    .placeholder{font-size:17px;color:#9a9a96;letter-spacing:0;font-weight:600;padding-left:0}
    .keypad{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:9px;
    }
    .key{
      min-height:68px;
      border:1px solid #a9a9a4;
      border-radius:16px;
      background:linear-gradient(#fafafa,#d9d9d5);
      box-shadow:inset 0 1px 0 #fff,0 2px 0 #9a9a96;
      font-size:31px;
      font-weight:700;
    }
    .key:active{transform:translateY(2px);box-shadow:inset 0 1px 0 #fff}
    .wide{grid-column:span 2;font-size:19px;background:linear-gradient(#ffc54b,#e89f00)}
    .zero{grid-column:1}
    .actions{display:flex;gap:9px;margin-top:12px}
    .action{
      min-height:52px;border:none;border-radius:14px;font-size:17px;font-weight:700;flex:1
    }
    .clear{background:#ececea}
    .save{background:var(--dark);color:#fff}
    .saved-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .saved-title strong{font-size:18px}
    .erase-all{border:none;background:none;color:var(--danger);font-size:14px;padding:8px}
    .list{display:grid;gap:9px}
    .empty{color:var(--muted);font-size:14px;padding:8px 0}
    .memo{
      display:grid;
      grid-template-columns:1fr auto;
      gap:10px;
      align-items:center;
      padding:13px 4px 13px 12px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
    }
    .memo-type{font-size:12px;color:var(--muted);margin-bottom:2px}
    .memo-num{font-size:29px;font-weight:800;letter-spacing:.06em}
    .del{
      min-width:48px;min-height:48px;border:none;border-radius:12px;
      background:#f5eded;color:var(--danger);font-size:20px
    }
    .hint{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>番号メモ</h1>

    <section class="card">
      <div class="label">何の番号？</div>
      <div class="types" id="types">
        <button class="type active" data-type="駐輪場">駐輪場</button>
        <button class="type" data-type="駐車場">駐車場</button>
        <button class="type" data-type="ロッカー">ロッカー</button>
        <button class="type" data-type="その他">その他</button>
      </div>

      <div id="display" class="display"><span class="placeholder">番号を入力</span></div>

      <div class="keypad" aria-label="数字入力">
        <button class="key" data-n="7">7</button>
        <button class="key" data-n="8">8</button>
        <button class="key" data-n="9">9</button>
        <button class="key" data-n="4">4</button>
        <button class="key" data-n="5">5</button>
        <button class="key" data-n="6">6</button>
        <button class="key" data-n="1">1</button>
        <button class="key" data-n="2">2</button>
        <button class="key" data-n="3">3</button>
        <button class="key zero" data-n="0">0</button>
        <button class="key wide" id="back">訂正</button>
      </div>

      <div class="actions">
        <button class="action clear" id="clear">クリア</button>
        <button class="action save" id="save">覚えておく</button>
      </div>
      <div class="hint">数字は最大8桁まで。保存した番号はこの端末内だけに残ります。</div>
    </section>

    <section class="card">
      <div class="saved-title">
        <strong>覚えている番号</strong>
        <button id="eraseAll" class="erase-all">すべて削除</button>
      </div>
      <div id="list" class="list"></div>
    </section>
  </main>

<script>
(() => {
  const KEY = 'temporary-number-memo-v1';
  let input = '';
  let selectedType = '駐輪場';

  const display = document.getElementById('display');
  const list = document.getElementById('list');

  function loadMemos(){
    try { return JSON.parse(localStorage.getItem(KEY) || '[]'); }
    catch { return []; }
  }
  function saveMemos(items){
    localStorage.setItem(KEY, JSON.stringify(items));
  }
  function renderInput(){
    if (!input) {
      display.innerHTML = '<span class="placeholder">番号を入力</span>';
    } else {
      display.textContent = input;
    }
  }
  function renderList(){
    const items = loadMemos();
    list.innerHTML = '';
    if (!items.length) {
      list.innerHTML = '<div class="empty">まだ番号はありません。</div>';
      return;
    }
    items.forEach((item, index) => {
      const row = document.createElement('div');
      row.className = 'memo';

      const info = document.createElement('div');
      const type = document.createElement('div');
      type.className = 'memo-type';
      type.textContent = item.type;
      const num = document.createElement('div');
      num.className = 'memo-num';
      num.textContent = item.number;
      info.append(type, num);

      const del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.setAttribute('aria-label', item.number + ' を削除');
      del.textContent = '×';
      del.addEventListener('click', () => {
        const now = loadMemos();
        now.splice(index, 1);
        saveMemos(now);
        renderList();
      });

      row.append(info, del);
      list.appendChild(row);
    });
  }

  document.querySelectorAll('[data-n]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (input.length >= 8) return;
      input += btn.dataset.n;
      renderInput();
    });
  });

  document.getElementById('back').addEventListener('click', () => {
    input = input.slice(0, -1);
    renderInput();
  });

  document.getElementById('clear').addEventListener('click', () => {
    input = '';
    renderInput();
  });

  document.getElementById('save').addEventListener('click', () => {
    if (!input) return;
    const items = loadMemos();
    items.unshift({ type: selectedType, number: input, createdAt: Date.now() });
    saveMemos(items.slice(0, 20));
    input = '';
    renderInput();
    renderList();
  });

  document.getElementById('types').addEventListener('click', e => {
    const btn = e.target.closest('[data-type]');
    if (!btn) return;
    document.querySelectorAll('.type').forEach(x => x.classList.remove('active'));
    btn.classList.add('active');
    selectedType = btn.dataset.type;
  });

  document.getElementById('eraseAll').addEventListener('click', () => {
    if (!loadMemos().length) return;
    if (confirm('保存した番号をすべて削除しますか？')) {
      localStorage.removeItem(KEY);
      renderList();
    }
  });

  renderInput();
  renderList();
})();
</script>
</body>
</html>
